<html lang="zh-CN">

    <style>
:root {
  --tencent-blue: #006eff;
  --deep-blue: #093b7a;
  --ink: #142033;
  --muted: #66758c;
  --line: #dbe7f5;
  --page: #f4f8fd;
  --panel: #ffffff;
  --high: #d92d20;
  --medium: #f79009;
  --low: #12b76a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--ink);
  background: var(--page);
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
    sans-serif;
}

.topbar {
  min-height: 96px;
  padding: 20px 32px;
  color: white;
  background:
    linear-gradient(90deg, rgba(0, 110, 255, 0.96), rgba(0, 82, 204, 0.9)),
    #006eff;
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand-mark {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.42);
  font-size: 26px;
  font-weight: 800;
}

.eyebrow,
.panel-heading p,
.timeline-header p,
.source-block p {
  margin: 0 0 6px;
  color: inherit;
  opacity: 0.78;
  font-size: 13px;
}

h1 {
  margin: 0;
  font-size: 26px;
  line-height: 1.25;
  letter-spacing: 0;
}

.app-shell {
  width: min(1440px, calc(100vw - 40px));
  margin: 24px auto 40px;
}

.scope-note {
  margin-bottom: 14px;
  padding: 12px 16px;
  border: 1px solid #b9ddff;
  border-left: 4px solid var(--tencent-blue);
  border-radius: 8px;
  color: #174b7c;
  background: #eef7ff;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.55;
}

.control-band {
  display: grid;
  grid-template-columns: minmax(260px, 1.4fr) repeat(3, minmax(160px, 1fr));
  gap: 14px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 12px 32px rgba(9, 59, 122, 0.08);
}

label {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

select,
input {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid #c9d8ea;
  border-radius: 6px;
  background: white;
  color: var(--ink);
  font: inherit;
}

select:focus,
input:focus {
  outline: 2px solid rgba(0, 110, 255, 0.18);
  border-color: var(--tencent-blue);
}

.dashboard-grid {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 18px;
  margin-top: 18px;
}

.profile-panel,
.main-panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}

.profile-panel {
  padding: 22px;
  align-self: start;
}

.panel-heading strong {
  display: block;
  font-size: 22px;
  line-height: 1.2;
}

.profile-location {
  display: block;
  margin-top: 8px;
  color: var(--tencent-blue);
  font-size: 14px;
  font-weight: 800;
}

.profile-copy {
  margin: 18px 0;
  color: #43536a;
  line-height: 1.7;
  font-size: 14px;
}

.meta-list {
  margin: 0;
  display: grid;
  gap: 10px;
}

.meta-list div {
  padding: 12px;
  border-radius: 6px;
  background: #f7fbff;
  border: 1px solid #e2edf9;
}

dt {
  color: var(--muted);
  font-size: 12px;
}

dd {
  margin: 5px 0 0;
  font-weight: 700;
}

.source-block {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.source-block a {
  display: block;
  margin-top: 8px;
  color: var(--tencent-blue);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.main-panel {
  padding: 18px;
}

.summary-strip {
  display: grid;
  grid-template-columns: minmax(150px, 0.9fr) minmax(120px, 0.7fr) minmax(120px, 0.7fr) minmax(340px, 1.8fr);
  gap: 12px;
}

.summary-card {
  min-height: 88px;
  padding: 14px;
  border: 1px solid #dfeafa;
  border-radius: 8px;
  background: #fbfdff;
}

.summary-card.primary {
  color: white;
  background: var(--deep-blue);
  border-color: var(--deep-blue);
}

.summary-card span {
  display: block;
  color: inherit;
  opacity: 0.72;
  font-size: 13px;
  margin-bottom: 10px;
}

.summary-card strong {
  display: block;
  font-size: 24px;
  line-height: 1.15;
}

#summaryWindow {
  max-height: 132px;
  overflow: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  font-size: 14px;
  line-height: 1.35;
}

#summaryWindow span {
  display: inline-block;
  padding: 6px 8px;
  border-radius: 6px;
  color: #075985;
  background: #eaf6ff;
  border: 1px solid #c6e3ff;
  font-weight: 800;
}

.insight-box {
  margin: 14px 0 18px;
  padding: 14px 16px;
  border-left: 4px solid var(--tencent-blue);
  background: #f5faff;
  color: #31506f;
  line-height: 1.65;
  border-radius: 0 8px 8px 0;
}

.timeline-header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 2px 14px;
  border-bottom: 1px solid var(--line);
}

.timeline-header h2 {
  margin: 0;
  font-size: 20px;
}

.legend {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.high {
  background: var(--high);
}

.medium {
  background: var(--medium);
}

.low {
  background: var(--low);
}

.timeline {
  padding-top: 10px;
}

.month-group {
  margin-top: 18px;
}

.month-label {
  margin: 0 0 10px;
  color: var(--deep-blue);
  font-size: 15px;
  font-weight: 800;
}

.event-row {
  display: grid;
  grid-template-columns: 126px 1fr auto;
  gap: 16px;
  padding: 14px 0;
  border-top: 1px solid #edf3fb;
}

.event-row:first-of-type {
  border-top: none;
}

.date-block {
  color: var(--deep-blue);
  font-weight: 800;
  line-height: 1.35;
}

.date-block span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

.event-title {
  margin: 0 0 8px;
  font-weight: 800;
  line-height: 1.45;
}

.event-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  padding: 4px 8px;
  border-radius: 999px;
  background: #eef6ff;
  color: #24527c;
  font-size: 12px;
  font-weight: 700;
}

.advice {
  margin: 8px 0 0;
  color: #51627a;
  font-size: 13px;
  line-height: 1.55;
}

.risk-badge {
  align-self: start;
  min-width: 76px;
  text-align: center;
  padding: 7px 10px;
  border-radius: 6px;
  color: white;
  font-size: 13px;
  font-weight: 800;
}

.empty-state {
  padding: 48px 16px;
  text-align: center;
  color: var(--muted);
}

@media (max-width: 980px) {
  .control-band,
  .dashboard-grid,
  .summary-strip {
    grid-template-columns: 1fr;
  }

  .event-row {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .risk-badge {
    justify-self: start;
  }
}

@media (max-width: 620px) {
  .topbar {
    padding: 18px;
  }

  .app-shell {
    width: min(100vw - 24px, 1440px);
  }

  h1 {
    font-size: 21px;
  }

  .timeline-header {
    align-items: start;
    flex-direction: column;
  }
}

</style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-mark">T</div>
      <div>
        <p class="eyebrow">腾讯校招</p>
        <h1>目标院校招生活动日历看板</h1>
      </div>
    </header>

    <main class="app-shell">
      <section class="scope-note">
        本看板当前用于本科项目招生活动排期参考；研究生及博士项目的具体日期可能因学院、项目或校区不同而有所变化。
      </section>

      <section class="control-band" aria-label="查询条件">
        <label>
          <span>目标大学</span>
          <select id="universitySelect"></select>
        </label>
        <label>
          <span>开始日期</span>
          <input id="startDate" type="date" value="2026-09-01" />
        </label>
        <label>
          <span>结束日期</span>
          <input id="endDate" type="date" value="2026-12-31" />
        </label>
        <label>
          <span>日期类型</span>
          <select id="typeSelect">
            <option value="all">全部类型</option>
            <option value="start">开学/学期开始</option>
            <option value="break">假期/Recess</option>
            <option value="exam">考试/Final</option>
            <option value="holiday">法定假日</option>
          </select>
        </label>
      </section>

      <section class="dashboard-grid">
        <aside class="profile-panel">
          <div class="panel-heading">
            <p>大学概览</p>
            <strong id="profileName"></strong>
            <span class="profile-location" id="profileLocation"></span>
          </div>
          <div class="profile-copy" id="profileIntro"></div>
          <dl class="meta-list">
            <div>
              <dt>校历体系</dt>
              <dd id="profileSystem"></dd>
            </div>
            <div>
              <dt>当前数据</dt>
              <dd id="profileCount"></dd>
            </div>
            <div>
              <dt>排期用途</dt>
              <dd>招生活动、宣讲会、校园拜访排期参考</dd>
            </div>
          </dl>
          <div class="source-block">
            <p>来源链接</p>
            <div id="sourceLinks"></div>
          </div>
        </aside>

        <section class="main-panel">
          <div class="summary-strip">
            <div class="summary-card primary">
              <span>排期判断</span>
              <strong id="summaryStatus"></strong>
            </div>
            <div class="summary-card">
              <span>相关日期</span>
              <strong id="summaryTotal"></strong>
            </div>
            <div class="summary-card">
              <span>高风险日期</span>
              <strong id="summaryRisk"></strong>
            </div>
            <div class="summary-card">
              <span>建议窗口</span>
              <strong id="summaryWindow"></strong>
            </div>
          </div>

          <div class="insight-box" id="insightBox"></div>

          <div class="timeline-header">
            <div>
              <p>关键日期时间线</p>
              <h2 id="rangeTitle"></h2>
            </div>
            <div class="legend">
              <span class="dot medium"></span>谨慎
              <span class="dot high"></span>避开
              <span class="dot low"></span>参考
            </div>
          </div>

          <div class="timeline" id="timeline"></div>
        </section>
      </section>
    </main>

function formatDate(dateString) {
  const date = new Date(`${dateString}T00:00:00`);
  return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
}

function formatShort(dateString) {
  const date = new Date(`${dateString}T00:00:00`);
  return `${date.getMonth() + 1}/${date.getDate()}`;
}

function formatRange(event) {
  if (event.start === event.end) {
    return formatDate(event.start);
  }
  return `${formatDate(event.start)} 至 ${formatDate(event.end)}`;
}

function addDays(dateString, days) {
  const date = new Date(`${dateString}T00:00:00`);
  date.setDate(date.getDate() + days);
  return date.toISOString().slice(0, 10);
}

function diffDays(start, end) {
  const startDateValue = new Date(`${start}T00:00:00`);
  const endDateValue = new Date(`${end}T00:00:00`);
  return Math.round((endDateValue - startDateValue) / 86400000) + 1;
}

function maxDate(a, b) {
  return a > b ? a : b;
}

function minDate(a, b) {
  return a < b ? a : b;
}

function formatAvailableRange(window) {
  if (window.start === window.end) return formatDate(window.start);
  return `${formatDate(window.start)} - ${formatDate(window.end)}`;
}

function renderAvailableWindows(windows) {
  if (!windows.length) return "暂无可用日期";
  return windows.map((window) => `<span>${formatAvailableRange(window)}</span>`).join("");
}

function monthKey(event) {
  const date = new Date(`${event.start}T00:00:00`);
  return `${date.getFullYear()}年${date.getMonth() + 1}月`;
}

function overlaps(event, start, end) {
  return event.start <= end && event.end >= start;
}

function getFilteredEvents() {
  const selectedUniversity = universitySelect.value;
  const selectedType = typeSelect.value;
  return events
    .filter((event) => event.university === selectedUniversity)
    .filter((event) => overlaps(event, startDate.value, endDate.value))
    .filter((event) => selectedType === "all" || event.kind === selectedType)
    .sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
}

function getPlanningEvents() {
  const selectedUniversity = universitySelect.value;
  return events
    .filter((event) => event.university === selectedUniversity)
    .filter((event) => overlaps(event, startDate.value, endDate.value))
    .sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
}

function getProfile() {
  return uniqueUniversities.find((item) => item.name === universitySelect.value);
}

function findAvailableWindows(planningEvents) {
  const start = startDate.value;
  const end = endDate.value;
  const blocked = planningEvents
    .map((event) => ({
      start: maxDate(event.start, start),
      end: minDate(event.end, end),
    }))
    .sort((a, b) => a.start.localeCompare(b.start));

  const merged = [];
  blocked.forEach((period) => {
    if (!merged.length || addDays(merged[merged.length - 1].end, 1) < period.start) {
      merged.push({ ...period });
    } else if (period.end > merged[merged.length - 1].end) {
      merged[merged.length - 1].end = period.end;
    }
  });

  let cursor = start;
  const candidates = [];
  merged.forEach((period) => {
    const candidateEnd = addDays(period.start, -1);
    if (cursor <= candidateEnd) {
      candidates.push({ start: cursor, end: candidateEnd, days: diffDays(cursor, candidateEnd) });
    }
    cursor = addDays(period.end, 1);
  });

  if (cursor <= end) {
    candidates.push({ start: cursor, end, days: diffDays(cursor, end) });
  }

  return candidates;
}

function decideStatus(planningEvents, availableWindows) {
  const highCount = planningEvents.filter((event) => event.risk === "高").length;
  const mediumCount = planningEvents.filter((event) => event.risk === "中").length;
  const windowSummary = availableWindows.length
    ? `共 ${availableWindows.length} 段可用日期`
    : "暂无可用日期";
  const firstWindow = availableWindows[0] ? formatAvailableRange(availableWindows[0]) : "";

  if (!planningEvents.length) {
    return {
      label: "暂无冲突",
      text: `所选时间段内没有匹配的关键日期，${windowSummary}。仍建议结合当地校方安排和团队资源确认。`,
    };
  }

  if (highCount >= 3) {
    return {
      label: "不建议安排",
      text: availableWindows.length
        ? `所选周期内有 ${highCount} 个高风险日期或区间。若必须安排，可先从 ${firstWindow} 等可用日期中评估，并避开时间线中的考试、假期和法定假日。`
        : `所选周期内有 ${highCount} 个高风险日期或区间，暂未找到清晰空档。建议更换时间范围。`,
    };
  }

  if (highCount > 0 || mediumCount >= 2) {
    return {
      label: "谨慎安排",
      text: availableWindows.length
        ? `所选周期内存在 ${highCount} 个高风险项、${mediumCount} 个中风险项。可用日期已列出，建议优先从 ${firstWindow} 开始评估，活动形式可偏向线上宣讲、申请答疑或短时段校园拜访。`
        : `所选周期内存在 ${highCount} 个高风险项、${mediumCount} 个中风险项，暂未找到清晰空档。建议缩小活动规模或更换日期。`,
    };
  }

  return {
    label: "推荐关注",
    text: `所选周期内风险较低，${windowSummary}。下一步可确认目标专业学生课表和校园场地可用性。`,
  };
}

function renderProfile(profile) {
  const allUniversityEvents = events.filter((event) => event.university === profile.name);
  const detail = universityDetails[profile.name] || {
    location: "Location to be confirmed",
    intro: `${profile.name} 已纳入目标院校日历库。本看板将校历日期转化为排期参考，帮助团队判断宣讲会、校园拜访和招生活动是否可能与开学、考试、假期或法定假日冲突。`,
  };
  profileName.textContent = profile.name;
  profileLocation.textContent = detail.location;
  profileSystem.textContent = profile.calendarSystem || "未标注";
  profileCount.textContent = `${allUniversityEvents.length} 条关键日期`;
  profileIntro.textContent = detail.intro;

  sourceLinks.innerHTML = "";
  if (!profile.sourceUrls.length) {
    sourceLinks.textContent = "暂无来源链接";
    return;
  }

  profile.sourceUrls.forEach((url, index) => {
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    link.rel = "noreferrer";
    link.textContent = `来源 ${index + 1}`;
    sourceLinks.appendChild(link);
  });
}

function renderSummary(filteredEvents, planningEvents) {
  const availableWindows = findAvailableWindows(planningEvents);
  const decision = decideStatus(planningEvents, availableWindows);
  const highCount = planningEvents.filter((event) => event.risk === "高").length;

  summaryStatus.textContent = decision.label;
  summaryTotal.textContent = `${filteredEvents.length} 条`;
  summaryRisk.textContent = `${highCount} 条`;
  summaryWindow.innerHTML = renderAvailableWindows(availableWindows);
  insightBox.textContent = decision.text;
  rangeTitle.textContent = `${formatDate(startDate.value)} - ${formatDate(endDate.value)}`;
}

function createEventRow(event) {
  const row = document.createElement("article");
  row.className = "event-row";

  const dateBlock = document.createElement("div");
  dateBlock.className = "date-block";
  dateBlock.innerHTML = event.start === event.end
    ? `${formatShort(event.start)}<span>单日</span>`
    : `${formatShort(event.start)} - ${formatShort(event.end)}<span>日期区间</span>`;

  const body = document.createElement("div");
  const title = document.createElement("p");
  title.className = "event-title";
  title.textContent = event.title;

  const meta = document.createElement("div");
  meta.className = "event-meta";
  [event.type, event.period, event.status].forEach((text) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = text;
    meta.appendChild(chip);
  });

  const advice = document.createElement("p");
  advice.className = "advice";
  advice.textContent = `${formatRange(event)}｜${event.advice}`;

  body.append(title, meta, advice);

  const risk = document.createElement("div");
  risk.className = `risk-badge ${riskClass[event.risk]}`;
  risk.textContent = `${event.risk}风险`;

  row.append(dateBlock, body, risk);
  return row;
}

function renderTimeline(filteredEvents) {
  timeline.innerHTML = "";

  if (!filteredEvents.length) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "该条件下暂无匹配日期。可以调整时间范围或日期类型。";
    timeline.appendChild(empty);
    return;
  }

  const groups = new Map();
  filteredEvents.forEach((event) => {
    const key = monthKey(event);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(event);
  });

  groups.forEach((groupEvents, key) => {
    const group = document.createElement("section");
    group.className = "month-group";

    const label = document.createElement("h3");
    label.className = "month-label";
    label.textContent = key;
    group.appendChild(label);

    groupEvents.forEach((event) => group.appendChild(createEventRow(event)));
    timeline.appendChild(group);
  });
}

function render() {
  const profile = getProfile();
  const filteredEvents = getFilteredEvents();
  const planningEvents = getPlanningEvents();
  renderProfile(profile);
  renderSummary(filteredEvents, planningEvents);
  renderTimeline(filteredEvents);
}

function init() {
  uniqueUniversities.forEach((university) => {
    const option = document.createElement("option");
    option.value = university.name;
    option.textContent = university.name;
    universitySelect.appendChild(option);
  });

  universitySelect.value = "University of Toronto";
  [universitySelect, startDate, endDate, typeSelect].forEach((control) => {
    control.addEventListener("change", render);
  });
  render();
}

init();
